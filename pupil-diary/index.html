<title>Pupil Diary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Overpass:wght@600;700;800;900&family=Overpass+Mono:wght@500;700&display=swap">
<style>
/* Layout: primary-route-sign header (green, white type, yellow week number) with tabs inline on desktop and a bottom tab bar on phones; Today run sheet, week diary grid or list, pupils, teaching sequence, money */
:root{
  --paper:#EEF2EF; --surface:#FFFFFF; --raised:#F3F6F4; --ink:#0F1F18; --muted:#55655D; --faint:#84938B; --line:#DBE3DE; --line-strong:#C2CEC7;
  --brand:#00703C; --brand-2:#005C31; --brand-ink:#FFFFFF; --brand-muted:#C4E6D2; --brand-btn:#00703C; --brand-text:#00693A; --route:#FFD200; --focus:#1D70B8;
  --accent:#D6202A; --accent-ink:#FFFFFF; --accent-soft:#FCE6E7;
  --tarmac:#16211C; --tarmac-2:#26342D; --tarmac-ink:#F2F6F4; --tarmac-muted:#9DAAA3; --sign:#FFD200; --sign-ink:#1A1600;
  --road:#1B2621; --amber:#8A5E00; --amber-bg:#FFF3D1;
  --ok:#187A48; --ok-bg:#DFF3E7; --warn:#A85800; --warn-bg:#FFE9CF; --bad:#BC222A; --bad-bg:#FCE3E4; --info:#1A5FA8; --info-bg:#E2EEFB;
  --hatch:#E1E7E3; --offhours:#F0F3F1; --mark:#5FA882; --mark-strong:#00703C;
  --lv0:#BFC6D1; --lv1:#EBC65E; --lv2:#E59A2B; --lv3:#57AB7B; --lv4:#187A48;
  --shadow:0 1px 2px rgba(15,31,24,.05),0 4px 14px rgba(15,31,24,.05);
  --shadow-lift:0 10px 30px rgba(15,31,24,.22);
  --f-display:"Overpass","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0B110E; --surface:#141B17; --raised:#1B2420; --ink:#E7EDEA; --muted:#9BA9A2; --faint:#6C7A73; --line:#25302A; --line-strong:#37463E;
  --brand:#0B4A2C; --brand-2:#0F5C38; --brand-ink:#F4FAF6; --brand-muted:#A6CDB7; --brand-btn:#12804A; --brand-text:#5FD39A; --route:#FFD84D; --focus:#6CB4F5;
  --accent:#F0474F; --accent-ink:#FFFFFF; --accent-soft:#3A1619;
  --tarmac:#232E28; --tarmac-2:#33413A; --tarmac-ink:#F2F6F4; --tarmac-muted:#9DAAA3; --sign:#FFD84D; --sign-ink:#1A1600;
  --road:#060A08; --amber:#F2B53A; --amber-bg:#372B0E;
  --ok:#4CC587; --ok-bg:#142D1E; --warn:#F0A54A; --warn-bg:#38250F; --bad:#F2666C; --bad-bg:#391618; --info:#7DB9F2; --info-bg:#12283F;
  --hatch:#202924; --offhours:#101612; --mark:#2E7D57; --mark-strong:#4CC587;
  --lv0:#49515F; --lv1:#9C8235; --lv2:#C97E1E; --lv3:#3F9467; --lv4:#4CC587;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  --shadow-lift:0 10px 30px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B110E; --surface:#141B17; --raised:#1B2420; --ink:#E7EDEA; --muted:#9BA9A2; --faint:#6C7A73; --line:#25302A; --line-strong:#37463E;
  --brand:#0B4A2C; --brand-2:#0F5C38; --brand-ink:#F4FAF6; --brand-muted:#A6CDB7; --brand-btn:#12804A; --brand-text:#5FD39A; --route:#FFD84D; --focus:#6CB4F5;
  --accent:#F0474F; --accent-ink:#FFFFFF; --accent-soft:#3A1619;
  --tarmac:#232E28; --tarmac-2:#33413A; --tarmac-ink:#F2F6F4; --tarmac-muted:#9DAAA3; --sign:#FFD84D; --sign-ink:#1A1600;
  --road:#060A08; --amber:#F2B53A; --amber-bg:#372B0E;
  --ok:#4CC587; --ok-bg:#142D1E; --warn:#F0A54A; --warn-bg:#38250F; --bad:#F2666C; --bad-bg:#391618; --info:#7DB9F2; --info-bg:#12283F;
  --hatch:#202924; --offhours:#101612; --mark:#2E7D57; --mark-strong:#4CC587;
  --lv0:#49515F; --lv1:#9C8235; --lv2:#C97E1E; --lv3:#3F9467; --lv4:#4CC587;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  --shadow-lift:0 10px 30px rgba(0,0,0,.6); color-scheme:dark}
/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary:disabled{opacity:.7;cursor:progress;box-shadow:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.icon{width:38px;height:38px;padding:0;flex:none}
.btn svg{width:16px;height:16px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:none;border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
input[type=text],input[type=number],input[type=time],input[type=tel],input[type=date],input[type=search],select,textarea{width:100%;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;color:var(--ink)}
input:hover,select:hover,textarea:hover{border-color:var(--line-strong)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
input[type=time],input[type=number]{font-family:var(--f-mono);font-size:14px}
input[type=search]{border-radius:999px;padding-inline:14px;background:var(--surface)}
label.f{display:grid;gap:5px;font-size:13px;color:var(--muted)}
label.f > span{font-weight:600}
.chk{display:flex;gap:9px;align-items:center;font-size:14px;color:var(--ink)}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none}

h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:24px 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0 0 6px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--raised);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.ex{background:var(--amber-bg);color:var(--amber)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px;background:var(--pc)}
.note{font-size:13.5px;padding:9px 12px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line)}
.note.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.banner{background:var(--amber-bg);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tarmac);color:var(--tarmac-ink);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:50;box-shadow:var(--shadow-lift);max-width:calc(100vw - 32px);text-align:center;border:1px solid var(--tarmac-2)}

/* ---------- diary: week title, actions, stats ---------- */
.hero{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;margin-bottom:16px}
.weeknav{display:flex;align-items:center;gap:8px;flex:1;min-width:min(100%,300px)}
.weeknav .wk{display:grid;gap:1px;min-width:0;padding-inline:4px}
.weeknav .wk b{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4.6vw,30px);line-height:1.05;letter-spacing:-.025em;white-space:nowrap}
.weeknav .wk span{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.weeknav .wk span.past{color:var(--warn)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.hero .actions{margin:0}
.actions .spacer{flex:1}
.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.stat{padding:14px 16px;display:grid;gap:3px;align-content:start;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0}
.stat .s{font-size:12px;color:var(--faint)}
.meter{height:5px;border-radius:99px;background:var(--raised);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.meter.part i{background:var(--lv2)}
@media (max-width:860px){
  .summary{grid-template-columns:repeat(6,minmax(0,1fr))}
  .stat{grid-column:span 2;border-top:1px solid var(--line)}
  .stat:nth-child(-n+2){grid-column:span 3;border-top:0}
  .stat:nth-child(3){border-left:0}
  .stat .v{font-size:24px}
  .stat:nth-child(n+3) .v{font-size:20px}
  .stat{padding:12px 14px}
}
.skipchip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px;font-weight:600;font-size:14px}

/* ---------- calendar ---------- */
.daychips{display:none;gap:6px;margin-bottom:12px}
.daychips button{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 2px 6px;cursor:pointer;display:grid;justify-items:center;gap:1px}
.daychips button b{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.daychips button em{font-style:normal;font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.15}
.daychips button span{font-size:10px;line-height:14px;letter-spacing:1px;color:var(--faint);min-height:14px;white-space:nowrap}
.daychips button.today em{color:var(--accent)}
.daychips button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.daychips button[aria-pressed="true"] b,.daychips button[aria-pressed="true"] span,.daychips button[aria-pressed="true"] em{color:inherit}
.daychips button[aria-pressed="true"] b,.daychips button[aria-pressed="true"] span{opacity:.72}
.daychips button.off em{opacity:.45}
.calwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;overflow:clip}
.cal{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr))}
.cal .head,.cal .corner{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,100px));background:var(--surface);border-bottom:1px solid var(--line);z-index:3}
.cal .head{padding:9px 6px 8px;text-align:center;cursor:pointer;border-left:1px solid var(--line);display:grid;gap:2px;justify-items:center}
.cal .head:hover{background:var(--raised)}
.cal .head b{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:6px}
.cal .head b em{font-style:normal;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;color:var(--ink);min-width:28px;height:28px;border-radius:99px;display:inline-grid;place-items:center;padding-inline:5px}
.cal .head.today b em{background:var(--accent);color:var(--accent-ink)}
.cal .head span{font-size:11px;color:var(--faint);font-family:var(--f-mono)}
.cal .head.off b,.cal .head.off b em{color:var(--faint)}
.gutter{position:relative}
.gutter .hr{position:absolute;right:8px;font-size:10.5px;color:var(--faint);transform:translateY(-50%)}
.gutter .hr.first{transform:translateY(3px)}
.col{position:relative;border-left:1px solid var(--line);cursor:copy}
.col.today{background:color-mix(in srgb,var(--accent) 3%,transparent)}
.col .line{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.75;pointer-events:none}
.col .line.half{border-top-style:dashed;opacity:.4}
.col .off{position:absolute;left:0;right:0;background:var(--offhours);pointer-events:none}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.block{position:absolute;left:3px;right:3px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);border:1px dashed var(--line-strong);color:var(--muted);font-size:11px;padding:4px 7px;overflow:hidden;cursor:pointer}
.lesson{position:absolute;left:3px;right:3px;border-radius:8px;padding:5px 8px;overflow:hidden;cursor:pointer;
  background:color-mix(in srgb,var(--pc) 15%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 30%,transparent);font-size:12px;line-height:1.25;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.lesson .n{font-weight:700;font-size:13px;color:color-mix(in srgb,var(--pc) 55%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson .t{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.lesson .l{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson .rz{position:absolute;left:0;right:0;bottom:0;height:10px;cursor:ns-resize;touch-action:none}
.lesson .rz::after{content:"";position:absolute;left:50%;bottom:3px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:color-mix(in srgb,var(--pc) 55%,transparent);opacity:0}
.lesson:hover .rz::after{opacity:.8}
.lesson.dragging{z-index:6;box-shadow:var(--shadow-lift),inset 0 0 0 2px var(--pc);cursor:grabbing;pointer-events:none}
.lesson.lifted{outline:2px solid var(--pc)}
body.dragmode{cursor:grabbing}
.lesson .lock{position:absolute;top:5px;right:6px;width:9px;height:9px;color:color-mix(in srgb,var(--pc) 55%,var(--ink));opacity:.7}
.lesson.ex{opacity:.92}
.travel{position:absolute;left:50%;transform:translate(-50%,-50%);background:var(--road);color:#fff;font-family:var(--f-mono);font-size:9.5px;font-weight:500;padding:1px 7px;border-radius:999px;white-space:nowrap;pointer-events:none;z-index:1;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sign) 70%,transparent)}
.travel.bad{background:var(--bad);box-shadow:none}
@media (hover:none){.lesson .rz::after{opacity:.7}}
@media (prefers-reduced-motion:no-preference){.lesson{transition:box-shadow .15s}.lesson:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 55%,transparent),0 3px 12px rgba(0,0,0,.14)}.btn{transition:transform .08s,filter .15s,border-color .15s}}
@media (max-width:760px){
  .daychips{display:flex}
  .cal{grid-template-columns:50px minmax(0,1fr)}
  .cal > .dcell:not(.sel){display:none}
  .cal .head{grid-auto-flow:column;justify-content:center;align-items:center;gap:10px}
  .lesson{padding:6px 10px}.lesson .n{font-size:14px}.lesson .t{font-size:11.5px}
}

.unplaced{margin-top:8px}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:11px;align-items:flex-start;flex-wrap:wrap}
.item .main{flex:1;min-width:min(100%,200px)}

/* ---------- pupils ---------- */
.ptabs{display:inline-flex;gap:2px;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:14px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.ptabs button{background:none;border:0;border-radius:999px;padding:6px 13px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.ptabs button span{font-size:11.5px;color:inherit;opacity:.75}
.ptabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.avtag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.avtag.ok{color:var(--ok);background:var(--ok-bg)}
.avtag.bad{color:var(--bad);background:var(--bad-bg)}
@media (max-width:520px){.avtag{font-size:0;padding:2px 7px}.avtag.ok::after{content:"✓";font-size:12px}.avtag.bad::after{content:"✗";font-size:12px}}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.prow+.prow{border-top:1px solid var(--line)}
.phead{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 14px;text-align:left;cursor:pointer}
.phead:hover{background:var(--raised)}
.ava{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.01em;background:color-mix(in srgb,var(--pc) 16%,var(--surface));color:color-mix(in srgb,var(--pc) 60%,var(--ink))}
.pname{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{white-space:nowrap;font-family:var(--f-mono);font-size:12px}
.chev{width:14px;height:14px;flex:none;color:var(--faint);transition:transform .15s}
.prow.open .chev{transform:rotate(180deg)}
.prow.open{background:color-mix(in srgb,var(--pc) 4%,var(--surface))}
.pbody{padding:2px 14px 14px 60px;display:grid;gap:9px}
.av{display:flex;flex-wrap:wrap;gap:5px}
.av span{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
@media (max-width:480px){.pmeta{display:none}.pbody{padding-left:14px}}

/* ---------- settings ---------- */
#tab-settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card p.help{margin:0 0 12px;color:var(--muted);font-size:13px;max-width:65ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px 16px}
.hours{display:grid;gap:7px}
.hours .hrow{display:grid;grid-template-columns:74px 1fr 1fr;gap:8px;align-items:center}
.matrix{overflow-x:auto}
.matrix table{border-collapse:separate;border-spacing:3px;font-size:13px}
.matrix th{font-weight:600;white-space:nowrap;padding:4px 8px;color:var(--muted);text-align:left}
.matrix td{padding:0}
.matrix input{width:64px;padding:6px;text-align:center}
.matrix td.same{background:var(--hatch);text-align:center;color:var(--muted);border-radius:var(--r-sm);font-size:12px}
.arearow{display:flex;gap:8px;align-items:center;margin-bottom:7px}

/* ---------- sheet ---------- */
dialog#sheet{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:18px;width:min(580px,calc(100vw - 24px));max-height:88vh;box-shadow:var(--shadow-lift)}
dialog#sheet::backdrop{background:rgba(8,10,15,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
@media (max-width:560px){dialog#sheet{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:20px 20px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom,0px)}
  dialog#sheet form::before{content:"";display:block;width:38px;height:4px;border-radius:99px;background:var(--line-strong);margin:9px auto -6px}}
.sh{padding:18px 18px 0;display:flex;align-items:center;gap:8px}
.sh h2{margin:0;flex:1;font-size:21px}
.sb{padding:14px 18px;display:grid;gap:14px}
.sf{padding:12px 18px 16px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.sf .spacer{flex:1}
.avrow{display:grid;grid-template-columns:76px 1fr 1fr 1fr 30px;gap:6px;align-items:center}
.avrow .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px;border-radius:50%;line-height:1;height:30px}
.avrow .x:hover{background:var(--bad-bg);color:var(--bad)}
.locpair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:0;background:var(--pc);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--pc)}

/* ---------- lessons tab ---------- */
.lp-top{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.lp-pick{flex:1;min-width:200px;max-width:340px}
.lp-pick select{background:var(--surface)}
.lp-top .seg{flex-wrap:wrap;border-radius:20px}
.lp-pupil{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
.lp-pupil .dot{width:12px;height:12px;margin-top:6px}
.lp-pupil .main{flex:1;min-width:0;display:grid;gap:5px}
.lp-pupil .main > b{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.lp-goal{background:var(--raised);border-radius:var(--r-sm);padding:6px 10px}
.lp-bar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;margin-top:6px}
.lp-bar i{height:10px;border-radius:3px;display:block}
.lp-intro{max-width:65ch;margin:0 0 10px}
.lp-key{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.lp-lv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;background:var(--raised);border:1px solid var(--line);white-space:nowrap}
.lp-lv i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.lp-stage{display:grid;gap:7px;margin-top:24px}
.lp-shead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.lp-shead h3{margin:0;font-size:19px;letter-spacing:-.01em}
.lp-sno{font-family:var(--f-mono);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:var(--sign);color:var(--sign-ink);border-radius:5px;padding:3px 8px}
.lp-topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lp-topic[open]{box-shadow:var(--shadow)}
.lp-topic summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r)}
.lp-topic summary:hover{background:var(--raised)}
.lp-topic summary::-webkit-details-marker{display:none}
.lp-no{font-weight:700;font-size:13px;color:var(--muted);width:30px;height:30px;border-radius:50%;background:var(--raised);display:grid;place-items:center}
.lp-name{font-weight:600;font-size:15.5px;line-height:1.3}
.lp-tgoal{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.lp-chev{color:var(--faint);font-size:20px;transition:transform .15s}
.lp-topic[open] .lp-chev{transform:rotate(90deg)}
@media (max-width:480px){.lp-topic summary{grid-template-columns:auto minmax(0,1fr) auto}.lp-chev{display:none}}
.lp-body{border-top:1px solid var(--line);padding:14px;display:grid;gap:14px}
.lp-body h4,.lp-step h4{font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
.lp-body ul,.lp-step ul,.lp-list{margin:0;padding-left:18px;display:grid;gap:4px}
.lp-body p{margin:0 0 6px}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.lp-grid>div{min-width:0}
.lp-fault{color:var(--bad);font-weight:600}
.lp-indep{background:var(--ok-bg);border-radius:var(--r-sm);padding:10px 12px}
.lp-indep h4{color:var(--ok)}
.lp-indep p{margin:0}
.lp-setlv{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.lp-setlv .f{min-width:180px}
.lp-builder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;gap:12px;margin-bottom:14px}
.lp-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.lp-ctop{background:var(--pc);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.lp-ctop h3{margin:0;font-size:22px;font-family:var(--f-display);font-weight:800;letter-spacing:-.01em}
.lp-cmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.lp-step{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.lp-step:last-child{border-bottom:0}
.lp-step h4{color:var(--ink);font-size:15px;text-transform:none;letter-spacing:0;font-weight:700}
.lp-step p{margin:0}
.lp-mins{font-weight:700;font-size:19px;color:var(--accent);line-height:1.2}
.lp-mins small{display:block;font-size:11px;font-weight:500;color:var(--muted);font-family:var(--f-body)}
.lp-shape{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.lp-shape .lp-step{grid-template-columns:36px minmax(0,1fr)}
.lp-n{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent);line-height:1.1}
.lp-tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.lp-tbl table{border-collapse:collapse;width:100%;font-size:14px}
.lp-tbl th,.lp-tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.lp-tbl th{background:var(--raised);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.lp-tbl tr:last-child td{border-bottom:0}
.lp-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 32px}
@media (prefers-reduced-motion:reduce){.lp-chev,.chev{transition:none}}

/* ---------- availability tab ---------- */
.av-top{align-items:center}
.av-top input[type=search]{flex:1;min-width:140px;max-width:240px}
.av-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:10px;align-items:center}
.av-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.av-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table.avg{border-collapse:separate;border-spacing:0;width:100%;min-width:820px;font-size:13px;table-layout:fixed}
.avg th,.avg td{border-bottom:1px solid var(--line);text-align:left;vertical-align:stretch}
.avg tr:last-child td{border-bottom:0}
.avg thead th{background:var(--surface);padding:10px 8px;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap}
.avg thead th small{display:block;font-weight:500;font-size:11px;color:var(--faint);text-transform:none;letter-spacing:0}
.avg .nm{position:sticky;left:0;z-index:1;background:var(--surface);width:176px;padding:6px 12px;border-right:1px solid var(--line)}
.avg td{padding:3px;height:46px}
.avg .nmb{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:9px;align-items:center;width:100%}
.avg .nmb .dot{margin:0}
.avg .nmb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avg .nmb small{grid-column:2;color:var(--muted);font-size:11px}
.avg .nmb:focus-visible{outline:2px solid var(--accent)}
.avc{display:flex;flex-direction:column;justify-content:center;gap:1px;width:100%;height:100%;border:0;border-radius:8px;cursor:pointer;text-align:left;padding:4px 8px;font:inherit;font-size:12.5px;line-height:1.25;color:var(--ink);background:var(--raised)}
.avc:hover{filter:brightness(.97)}
.avc.all{background:var(--ok-bg);color:var(--ok);font-weight:600}
.avc.part{background:var(--amber-bg)}
.avc.busy{background:transparent;color:var(--faint)}
.avc.none{background:repeating-linear-gradient(135deg,var(--hatch) 0 5px,transparent 5px 10px);color:var(--muted);font-style:italic}
.avc .pl{font-size:11px;color:var(--muted);font-weight:400}
.avc .bk{font-size:11px;font-weight:700;color:var(--accent)}
@media (max-width:560px){.avg .nm{width:122px;padding:6px 8px}.avg .nmb{column-gap:6px}table.avg{min-width:720px}}
.fd-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.fd-row .seg{flex-wrap:wrap;border-radius:20px}
.cov-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.cov{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(24px,1fr);gap:3px;height:120px;overflow-x:auto;padding-bottom:2px}
.cov button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;cursor:pointer;padding:0;color:var(--muted);border-radius:6px}
.cov button:hover{background:var(--raised)}
.cov .c{font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--ink);min-height:14px}
.cov .bar{flex:1;width:100%;display:flex;align-items:flex-end;padding:0 2px}
.cov .bar i{display:block;width:100%;min-height:2px;border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--ok) 55%,var(--surface))}
.cov button[aria-pressed="true"] .bar i{background:var(--accent)}
.cov button[aria-pressed="true"] .c{color:var(--accent)}
.cov button.taken .bar{box-shadow:inset 0 -3px 0 var(--road)}
.cov .tl{font-size:10px;white-space:nowrap;min-height:13px}
.fd-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 12px}
.fd-head h2{margin:0;flex:1;min-width:200px}
.fd-head input[type=time]{width:auto}
.fd-not{margin-top:14px}
.fd-not summary{cursor:pointer;font-weight:600;color:var(--muted);padding:6px 0}
.fd-not ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px}
.fd-not li{display:flex;gap:8px;font-size:14px;align-items:baseline}
.fd-not li span{color:var(--muted);font-size:13px}

/* ===== v3 shell and components (overrides the base rules above) ===== */
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-block:22px 72px}
h2{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;margin:26px 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:800;font-size:16px;margin:0 0 6px}
.eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* header: a primary-route sign */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);box-shadow:0 1px 0 var(--brand-2),0 6px 18px -10px rgba(0,0,0,.45)}
header.top::after{content:none}
.bar{display:flex;align-items:center;gap:14px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;flex:none;text-decoration:none;color:inherit;border-radius:8px}
.lplate{width:32px;height:32px;border-radius:5px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 2px 5px rgba(0,0,0,.3)}
.lplate span{font-family:var(--f-display);font-weight:900;color:#D6202A;font-size:25px;line-height:1;transform:translateY(1px)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow:visible;padding:0;margin:0 0 0 6px}
nav.tabs button{display:flex;align-items:center;gap:7px;background:none;border:0;border-radius:9px;padding:8px 12px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--brand-muted);cursor:pointer;white-space:nowrap}
nav.tabs button svg{width:17px;height:17px}
nav.tabs button:hover{color:var(--brand-ink);background:var(--brand-2)}
nav.tabs button[aria-selected="true"]{background:var(--brand-ink);color:var(--brand)}
nav.tabs button:focus-visible,.bar :focus-visible{outline-color:var(--route)}
.bar .spacer{flex:1}
.wkplate{flex:none;display:inline-flex;align-items:baseline;gap:5px;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--route);background:transparent;border:2px solid var(--brand-ink);border-radius:7px;padding:2px 8px 1px;cursor:pointer;letter-spacing:.01em}
.wkplate small{font-size:10.5px;font-weight:700;color:var(--brand-ink);letter-spacing:.08em;text-transform:uppercase}
.wkplate:hover{background:var(--brand-2)}
.sync{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--brand-muted);background:var(--brand-2);border-radius:999px;padding:5px 11px 5px 9px;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:#7DE0A8;flex:none}
.sync[data-s="busy"]::before{background:var(--route)}
.sync[data-s="warn"]::before{background:#FF9C73}
.iconbtn{width:36px;height:36px;border-radius:9px;border:0;background:none;color:var(--brand-muted);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover,.iconbtn[aria-pressed="true"]{background:var(--brand-2);color:var(--brand-ink)}
.iconbtn svg{width:19px;height:19px}
.tabbar{display:none}
@media (max-width:820px){
  nav.tabs{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:5px max(6px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px -12px rgba(0,0,0,.25)}
  .tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 2px 4px;border-radius:10px;font-family:var(--f-display);font-weight:700;font-size:11.5px;color:var(--faint);cursor:pointer}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-selected="true"]{color:var(--brand-text)}
  .tabbar button[aria-selected="true"] svg{stroke-width:2.3}
  main{padding-block:16px calc(92px + env(safe-area-inset-bottom,0px))}
  .bar{min-height:52px;gap:10px}
}
@media (max-width:480px){.sync{font-size:0;padding:7px;gap:0}.brand b{font-size:17px}}

/* controls */
.btn{border-radius:10px;padding:8px 14px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px}
.btn.primary{background:var(--brand-btn);border-color:var(--brand-btn);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.12),0 3px 10px -3px color-mix(in srgb,var(--brand-btn) 60%,transparent)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.icon{width:38px;height:38px;padding:0}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.on{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.seg{border-radius:11px;padding:3px}
.seg button{border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line)}
.ptabs{border-radius:11px}
.ptabs button{border-radius:8px}
.ptabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line)}
input[type=search]{border-radius:10px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.chk input{accent-color:var(--brand-btn)}
.pill{border-radius:6px;font-weight:700;font-size:11.5px;padding:2px 7px;letter-spacing:.01em}
.pill.info{background:var(--info-bg);color:var(--info)}
.card,.plist,.calwrap,.summary,.lp-pupil,.lp-builder,.lp-card,.lp-shape,.lp-tbl,.av-wrap,.cov-card,.item{border-radius:var(--r)}
.empty{border-radius:var(--r);padding:36px 20px}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:17px}
.toast{inset:auto;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);margin:0;background:var(--tarmac);color:var(--tarmac-ink);border:1px solid var(--tarmac-2);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:14px;font-weight:500;box-shadow:var(--shadow-lift);max-width:calc(100vw - 32px);width:max-content}
.toast:not(:popover-open):not(.show){display:none}
.toast button{border:0;background:none;color:var(--route);font-weight:700;cursor:pointer;padding:2px 4px;border-radius:6px;font-family:var(--f-display)}
@media (min-width:821px){.toast{bottom:24px}}

/* avatars and lesson rows (Today, list view, profile) */
.ava{width:36px;height:36px;border-radius:11px;font-family:var(--f-display);font-weight:800;font-size:13.5px}
.ava.lg{width:52px;height:52px;border-radius:15px;font-size:19px}
.lrows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.lrow{display:grid;grid-template-columns:54px auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--raised)}
.lr-time{font-weight:700;font-size:15px;line-height:1.15}
.lr-time small{display:block;font-weight:500;font-size:11.5px;color:var(--faint)}
.lr-main{min-width:0;display:grid;gap:1px}
.lr-main b{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-main span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-end{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lrow.done .lr-main b,.lrow.done .lr-time{color:var(--muted)}
.lrow.cancelled .lr-main b,.lrow.cancelled .lr-time{text-decoration:line-through;color:var(--faint)}
.lrow.now{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.tick{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:transparent;flex:none;font-weight:800;font-size:13px}
.tick svg{width:16px;height:16px}
.tick:hover{border-color:var(--ok);color:var(--ok)}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tick.pay{color:var(--faint);font-family:var(--f-display)}
.tick.pay[aria-pressed="true"]{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.lr-gap{display:flex;align-items:center;gap:8px;padding:3px 14px 3px 80px;font-size:11.5px;color:var(--faint);background:var(--raised);border-top:1px solid var(--line);font-family:var(--f-mono)}

<script>

const KEY='pupil-diary-v2';

function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ini(n){const w=String(n||'').replace(/\(.*?\)/g,' ').trim().split(/\s+/).filter(Boolean);return esc(((w[0]||'?')[0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase())}
function pct(a,b){return b>0?Math.max(0,Math.min(100,Math.round(a/b*100))):0}
function toMin(s){if(!s)return null;const [h,m]=s.split(':').map(Number);return h*60+(m||0)}
function fmt(m){m=Math.round(m);const h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')}
function hrs(m){const h=m/60;return (Math.round(h*100)/100).toString()}
function mondayOf(d){const x=new Date(d);x.setHours(12,0,0,0);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x.toISOString().slice(0,10)}
function dateFor(day){const d=new Date(viewWeek+'T12:00:00');d.setDate(d.getDate()+day);return d}
function shortDate(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}

function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return mondayOf(d)}
function defaultView(){const t=new Date();const wd=t.getDay();return (wd===0||wd===6)?addDays(mondayOf(t),7):mondayOf(t)}
function defaultState(){
  return {v:2,
    settings:{days:DAYS.map((_,i)=>({on:i<6,start:540,end:i<5?1140:780})),
      gap:15,sameArea:10,crossDefault:20,step:15,base:null,baseTravel:true,maxDayHours:8,

async function initDb(){

/* ---------- schedule maths ---------- */
function dayMetrics(list){ // list sorted by start; items {start,dur,loc}
  const s=S();let tr=0,idle=0,mins=0,ok=true,conflicts=[];
  for(let i=0;i<list.length;i++){
    mins+=list[i].dur;
    if(i>0){
      const prev=list[i-1],need=travel(prev.loc,list[i].loc)+(+s.gap||0);
      const space=list[i].start-(prev.start+prev.dur);
      tr+=travel(prev.loc,list[i].loc);

    }
  }
  if(list.length&&s.base&&s.baseTravel){tr+=travel(s.base,list[0].loc)+travel(list[list.length-1].loc,s.base)}
  if(mins>(+s.maxDayHours||24)*60)ok=false;
  return {ok,travel:tr,idle,mins,conflicts};
}
function dayCost(m,n){
  if(!n)return 0;

  return c;
}
function insertSorted(arr,item){const a=arr.slice();let i=0;while(i<a.length&&a[i].start<item.start)i++;a.splice(i,0,item);return a}
function overlapsBlock(day,start,end){
  return allBlocks().some(b=>b.day===day&&start<b.end&&end>b.start);

function candidatesFor(p){
  const s=S(),dur=Math.round(p.hours*60),step=+s.step||15,out=[];

    const dh=s.days[sl.day];if(!dh||!dh.on)continue;
    const from=Math.max(sl.from,dh.start),to=Math.min(sl.to,dh.end);
    const loc=(sl.loc==='B'?p.locB:p.locA)?.area||null;
    for(let t=Math.ceil(from/step)*step;t+dur<=to;t+=step){
      if(overlapsBlock(sl.day,t,t+dur))continue;
      out.push({day:sl.day,start:t,dur,loc,locKey:sl.loc||'A',pref:(t%30?3:0)});
    }
  }

}
function pupilPenalty(counts,day){
  const s=S();

  if(counts[day]>0)p+=40;
  if(s.avoidConsecutive&&((day>0&&counts[day-1]>0)||(day<6&&counts[day+1]>0)))p+=25;
  return p;
}

function optimise(onProgress){
  return new Promise(resolve=>{
    const locked=week.lessons.filter(l=>l.locked);
    const base=[[],[],[],[],[],[],[]];
    const baseCounts={};
    for(const l of locked){if(l.st!=='cancelled')base[l.day]=insertSorted(base[l.day],l);(baseCounts[l.pupilId]=baseCounts[l.pupilId]||[0,0,0,0,0,0,0])[l.day]++}
    const reqs=[];const candMap={};
    for(const p of state.pupils){
      if(isOff(p))continue;
      const have=locked.filter(l=>l.pupilId===p.id).length;
      const need=Math.max(0,(+p.perWeek||0)-have);
      if(!need)continue;
      const c=candidatesFor(p);candMap[p.id]=c;
      for(let i=0;i<need;i++)reqs.push({p,c});
    }
    if(!reqs.length){resolve({lessons:[],unplaced:[]});return}

    function run(order,noise){
      const days=base.map(d=>d.slice());
      const cache=days.map(d=>dayCost(dayMetrics(d),d.length));
      const counts={};for(const k in baseCounts)counts[k]=baseCounts[k].slice();
      const placed=[],unplaced=[];
      for(const r of order){
        const cnt=counts[r.p.id]||(counts[r.p.id]=[0,0,0,0,0,0,0]);
        let best=null;
        for(const c of r.c){
          const pen=pupilPenalty(cnt,c.day);if(pen===Infinity)continue;
          const item={pupilId:r.p.id,day:c.day,start:c.start,dur:c.dur,loc:c.loc,locKey:c.locKey};
          const arr=insertSorted(days[c.day],item);
          const m=dayMetrics(arr);if(!m.ok)continue;
          const nc=dayCost(m,true);
          const delta=nc-cache[c.day]+pen+c.pref+(noise?Math.random()*noise:0);
          if(!best||delta<best.delta)best={delta,arr,nc,item,day:c.day};
        }
        if(best){days[best.day]=best.arr;cache[best.day]=best.nc;cnt[best.day]++;placed.push(best.item)}
        else unplaced.push(r.p.id);
      }
      let total=cache.reduce((a,b)=>a+b,0)+unplaced.length*5000;
      for(const k in counts){const c=counts[k];for(let d=0;d<6;d++)if(S().avoidConsecutive&&c[d]&&c[d+1])total+=25}
      return {placed,unplaced,total};
    }

    const sorted=reqs.slice().sort((a,b)=>a.c.length-b.c.length);
    let best=run(sorted,0);
    const ITER=360;let i=0;
    function chunk(){
      for(let k=0;k<30&&i<ITER;k++,i++){
        const order=reqs.slice().sort((a,b)=>a.c.length*(0.4+Math.random())-b.c.length*(0.4+Math.random()));
        const r=run(order,i%3===0?0:18);
        if(r.total<best.total)best=r;
      }
      onProgress&&onProgress(i/ITER);
      if(i<ITER)setTimeout(chunk,0);
      else{
        // polish: re-run with best placement order, no noise
        const order=[];const pidOrder=best.placed.map(x=>x.pupilId).concat(best.unplaced);
        const pool=reqs.slice();
        for(const pid of pidOrder){const ix=pool.findIndex(r=>r.p.id===pid);if(ix>-1)order.push(pool.splice(ix,1)[0])}
        const r=run(order.concat(pool),0);if(r.total<best.total)best=r;
        const unplaced={};best.unplaced.forEach(id=>unplaced[id]=(unplaced[id]||0)+1);
        resolve({lessons:best.placed.map(x=>({id:'l'+uid(),...x,locked:false})),unplaced:Object.entries(unplaced).map(([id,n])=>({id,n,cands:candMap[id].length}))});
      }
    }
    setTimeout(chunk,0);
  });
}

  }
  if(!any&&!goneN&&!cnt.remove)h+=`<div class="empty">No lessons in the diary for this week yet.</div>`;
  h+=`</div><div class="sf"><button type="button" class="btn" data-act="td-copy-all">Copy the list</button><span class="spacer"></span><button type="button" class="btn" data-act="close">Done</button>${cnt.new+cnt.changed+cnt.remove+goneN?`<button type="button" class="btn primary" data-act="td-all">Mark all as done</button>`:''}</div>`;
  openSheet(h,{td:1},'wide');sheet.scrollTop=keep;
}

/* ---------- undo + toast ---------- */
let undoSnap=null,undoFresh=false;
function pushUndo(){undoSnap={wk:viewWeek,week:JSON.stringify(week),state:JSON.stringify(state)};undoFresh=true}
function doUndo(){
  if(!undoSnap)return;const u=undoSnap;undoSnap=null;
  state=normalize(JSON.parse(u.state));
  if(u.wk===viewWeek)week=normWeek(JSON.parse(u.week));else{cache[u.wk]=normWeek(JSON.parse(u.week));saveWeekDoc(u.wk)}
  lastUnplaced=null;save();renderAll();toast('Undone');
}
function toast(t){
  const el=$('toast');const u=undoFresh&&undoSnap;undoFresh=false;
  el.innerHTML=`<span>${esc(t)}</span>`+(u?'<button type="button" data-act="undo">Undo</button>':'');
  try{if(el.matches(':popover-open'))el.hidePopover();el.showPopover()}catch(e){el.classList.add('show')}
  clearTimeout(toast.t);toast.t=setTimeout(()=>{try{el.hidePopover()}catch(e){}el.classList.remove('show')},u?7000:2600);
}
function saveWeekDoc(date){
  if(date===viewWeek){save();return}
  persistLocal();if(!db)return;
  const wj=JSON.stringify(cache[date]);lastWeek[date]=wj;write(db.doc('weeks/'+date),JSON.parse(wj));
}
let allLoaded=false,allP=null;
function loadAllWeeks(){
  if(allP)return allP;
  allP=(async()=>{
    if(db){try{
      const s=await db.collection('weeks').limit(500).get();
      s.docs.forEach(d=>{if(d.id===viewWeek||!d.exists)return;const j=JSON.stringify(d.data());lastWeek[d.id]=j;cache[d.id]=normWeek(JSON.parse(j))});
    }catch(e){allP=null;return}}
    allLoaded=true;persistLocal();
  })();
  return allP;
}

function weekRange(){
  const s=S();let lo=24*60,hi=0;
  s.days.forEach(d=>{if(d.on){lo=Math.min(lo,d.start);hi=Math.max(hi,d.end)}});
  week.lessons.forEach(l=>{lo=Math.min(lo,l.start);hi=Math.max(hi,l.start+l.dur)});
  allBlocks().forEach(b=>{if(b.end-b.start<24*60-1){lo=Math.min(lo,b.start);hi=Math.max(hi,b.end)}});
  if(hi<=lo){lo=480;hi=1140}
  const vf=s.viewFrom==null?420:+s.viewFrom;if(vf>=0)lo=Math.min(lo,vf);
  lo=Math.floor(lo/60)*60;hi=Math.ceil(hi/60)*60;
  return [Math.max(0,lo),Math.min(1440,hi)];
}
function totals(){
  let mins=0,tr=0,idle=0,conflicts=0,income=0,paid=0;
  for(let d=0;d<7;d++){const m=dayMetrics(dayLessons(d));mins+=m.mins;tr+=m.travel;idle+=m.idle;conflicts+=m.conflicts.length}
  week.lessons.forEach(l=>{const f=feeOf(l);income+=f;if(l.paid)paid+=f});
  const act=state.pupils.filter(p=>!isOff(p));
  return {mins,tr,idle,conflicts,income,paid,want:act.reduce((a,p)=>a+(+p.perWeek||0),0),wantMins:act.reduce((a,p)=>a+(+p.perWeek||0)*p.hours*60,0),booked:week.lessons.filter(l=>!gone(l)).length};
}

    for(let d=0;d<7;d++){

      if(d===tIdx&&nowMin>lo&&nowMin<hi)html+=`<div class="nowline" style="top:${(nowMin-lo)*PPM}px"></div>`;

/* best free slots for one pupil, given what is already booked */
function slotOptions(p,max){
  const out=[];const have=[0,0,0,0,0,0,0];week.lessons.forEach(l=>{if(l.pupilId===p.id&&!gone(l))have[l.day]++});
  for(const c of candidatesFor(p)){
    const cur=dayLessons(c.day);
    if(cur.some(x=>c.start<x.start+x.dur&&c.start+c.dur>x.start))continue;
    const before=dayMetrics(cur);const m=dayMetrics(insertSorted(cur,{start:c.start,dur:c.dur,loc:c.loc}));
    if(!m.ok)continue;
    out.push(Object.assign({},c,{cost:dayCost(m,true)-dayCost(before,cur.length)+(have[c.day]?40:0)+c.pref,extra:m.travel-before.travel,first:!cur.length}));
  }
  out.sort((a,b)=>a.cost-b.cost);
  const per={},res=[];
  for(const o of out){if((per[o.day]||0)>=2||res.some(r=>r.day===o.day&&Math.abs(r.start-o.start)<90))continue;per[o.day]=(per[o.day]||0)+1;res.push(o);if(res.length>=(max||6))break}
  return res;
}
function slotSheet(p){
  const opts=slotOptions(p);
  openSheet(`<div class="sh"><h2>Slots for ${esc(first(p))}</h2><button type="button" class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="sb"><p class="muted small" style="margin:0">Best times this week for a ${hrs(p.hours*60)} h lesson, from when ${esc(first(p))} is free, with room for your travel and gap. Least extra driving first.</p>
  ${opts.length?opts.map(o=>`<div class="slot"><div><b>${DAYS_LONG[o.day]} ${dateFor(o.day).getDate()}</b> <span class="num">${fmt(o.start)}–${fmt(o.start+o.dur)}</span><div class="muted small">${esc(locLabel(p,o.locKey))} · ${o.first?'first lesson that day':o.extra>0?'adds '+o.extra+' min driving':'no extra driving'}</div></div><button type="button" class="btn sm primary" data-act="book-slot" data-id="${p.id}" data-day="${o.day}" data-m="${o.start}" data-loc="${o.locKey}">Book</button></div>`).join(''):`<div class="empty">${p.avail.length?'No slot works this week with what’s already booked. Try moving another lesson, or widen their free times.':'No free times entered for '+esc(first(p))+' yet.'}<div style="margin-top:10px"><button type="button" class="btn" data-act="edit-pupil" data-id="${p.id}">Edit their times</button></div></div>`}
  </div>`);
}

function readPupilSheet(){
  const p=sheetCtx.pupilDraft;const v=id=>$(id).value.trim();
  p.name=v('p-name');
  p.perWeek=Math.max(0,parseInt(v('p-per'))||0);
  p.hours=Math.max(0.25,parseFloat(v('p-hrs'))||1);
  p.locA={label:v('p-la')||'Home',area:areaByName(v('p-aa'))};
  p.locB={label:v('p-lb'),area:areaByName(v('p-ab'))};
  p.phone=v('p-phone');p.notes=v('p-notes');
  if(v('p-tdate'))p.test={date:v('p-tdate'),time:v('p-ttime'),centre:v('p-tcentre')};else delete p.test;
  if(v('p-rate')!==''&&+v('p-rate')>0)p.rate=+v('p-rate');else delete p.rate;
  p.theory=$('p-theory').checked;
  setStatus(p,$('p-status').value);
  p.avail=[...document.querySelectorAll('#avRows .avrow')].map(r=>({day:+r.querySelector('.av-day').value,from:toMin(r.querySelector('.av-from').value),to:toMin(r.querySelector('.av-to').value),loc:r.querySelector('.av-loc').value})).filter(a=>a.from!=null&&a.to!=null&&a.to>a.from);
  return p;
}

function weekSum(wk,w){let fee=0,paid=0,mins=0,n=0,owe=0;for(const l of w.lessons){if(gone(l))continue;const f=feeOf(l);fee+=f;mins+=l.dur;n++;if(l.paid)paid+=f;else if(owes(wk,l))owe+=f}return {fee,paid,mins,n,owe}}

  if(!allLoaded)loadAllWeeks().then(()=>{if(allLoaded&&tab==='money')renderAll()});
  const map=Object.fromEntries(allWeeks());const nw=nowWeek();

  const cur=wks[7].s,nxt=weekSum(addDays(nw,7),normWeek(map[addDays(nw,7)]));
  const td=TD();const ow=td?[]:owedItems();const owTotal=ow.reduce((a,x)=>a+x.fee,0);
  const prev4=wks.slice(3,7).reduce((a,x)=>a+x.s.fee,0)/4;
  const mx=Math.max(1,...wks.map(x=>x.s.fee));
  let h=`<div class="hero"><div style="flex:1;min-width:min(100%,260px)"><h3 style="margin:0">${td?'Takings from the diary':'Takings and what’s owed'}</h3></div><div class="actions"><button type="button" class="btn" data-act="csv">Download lessons (CSV)</button></div></div>`;
  h+=`<div class="tiles">
    <div class="tile"><div class="k">This week</div><div class="v">${money(cur.fee)}</div><div class="s">${cur.n} lesson${cur.n===1?'':'s'} · ${hrs(cur.mins)} h${td?'':' · '+money(cur.paid)+' paid'}</div></div>
    <div class="tile ${owTotal?'owe':''}" ${td?'hidden':''}><div class="k">Owed to you</div><div class="v">${money(owTotal)}</div><div class="s">${ow.length?`${ow.length} unpaid lesson${ow.length>1?'s':''} already taken`:'Nothing outstanding'}</div></div>
    <div class="tile"><div class="k">Next week booked</div><div class="v">${money(nxt.fee)}</div><div class="s">${nxt.n} lesson${nxt.n===1?'':'s'} · ${hrs(nxt.mins)} h</div></div>
    <div class="tile"><div class="k">Usual week</div><div class="v">${money(Math.round(prev4))}</div><div class="s">average of the last 4 weeks</div></div>
  </div>`;
  h+=`<div class="chartcard"><h3>Weekly takings<span>last 8 weeks, cancelled lessons left out</span></h3>
    <div class="bars" role="img" aria-label="Weekly takings for the last 8 weeks">${wks.map((x,i)=>`<div class="bc ${i===7?'cur':''}" tabindex="0"><b>${x.s.fee?money(Math.round(x.s.fee)):''}</b><i style="height:${x.s.fee/mx*82}%"></i><span class="tip"><b>Week of ${shortDate(new Date(x.k+'T12:00:00'))}</b><br>${money(x.s.fee)} · ${x.s.n} lesson${x.s.n===1?'':'s'} · ${hrs(x.s.mins)} h${td?'':`<br>${money(x.s.paid)} paid${x.s.owe?' · '+money(x.s.owe)+' owed':''}`}</span></div>`).join('')}</div>
    <div class="barlabels">${wks.map((x,i)=>`<span class="${i===7?'cur':''}">${i===7?'This week':shortDate(new Date(x.k+'T12:00:00'))}</span>`).join('')}</div></div>`;
  if(!td)h+='<h2>Owed to you</h2>';
  if(td){}else if(ow.length){
    const by={};ow.forEach(x=>(by[x.p.id]=by[x.p.id]||[]).push(x));
    h+='<div class="lrows">'+Object.values(by).sort((a,b)=>b.reduce((s,x)=>s+x.fee,0)-a.reduce((s,x)=>s+x.fee,0)).map(xs=>{const p=xs[0].p;xs.sort((a,b)=>a.date.localeCompare(b.date));
      return `<div class="owerow">${avaHtml(p)}<div class="main"><b>${esc(p.name)}</b><div class="muted small">${xs.map(x=>`${niceDate(x.date)} (${hrs(x.l.dur)} h)`).join(', ')}</div></div><span class="amt">${money(xs.reduce((s,x)=>s+x.fee,0))}</span><div class="row"><button type="button" class="btn sm" data-act="copy-owed" data-id="${p.id}">Copy reminder</button><button type="button" class="btn sm primary" data-act="pay-all" data-id="${p.id}">Mark paid</button></div></div>`}).join('')+'</div>';
  }else h+=`<div class="empty"><b>All square</b><br>Every lesson already taken is marked paid. Tick the £ on a lesson when a pupil pays.</div>`;

  h+=`<h2>${viewWeek===nw?'This week':'Week of '+shortDate(dateFor(0))} by pupil</h2>`;

  el.innerHTML=h;
}
function csvText(){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Date','Day','Start','End','Hours','Pupil','Pick-up','Status','Topic','Fee','Paid','Notes']];
  for(const [wk,w] of allWeeks())for(const l of w.lessons.slice().sort((a,b)=>a.day-b.day||a.start-b.start)){
    const p=pupil(l.pupilId);const tp=l.topic&&lpTopic(l.topic);
    rows.push([isoOf(wk,l.day),DAYS[l.day],fmt(l.start),fmt(l.start+l.dur),hrs(l.dur),p?.name||'Removed pupil',p?locLabel(p,l.locKey):'',l.st||(isPast(wk,l)?'taken':'booked'),tp?tp.name:'',feeOf(l),l.paid?'yes':'no',l.note||'']);
  }
  return rows.map(r=>r.map(q).join(',')).join('\n');
}
async function downloadFile(filename,data){
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(!dl)throw {code:'unavailable'};
    await dl.save({filename,data});toast('Saved '+filename);
  }catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return;fallbackCopy(data)}
}

function lessonSheet(l,prefill){
  const isNew=!l;
  if(!state.pupils.length){openSheet(`<div class="sh"><h2>Add lesson</h2></div><div class="sb"><p style="margin:0">Add a pupil first.</p></div><div class="sf"><span class="spacer"></span><button type="button" class="btn" data-act="close">Close</button><button type="button" class="btn primary" data-act="new-pupil">Add pupil</button></div>`);return}

  openSheet(`<div class="sh"><h2>${isNew?'Add lesson':'Lesson'}</h2><span class="pill" id="l-fee">${money(feeOf(l))}</span><button type="button" class="x" data-act="close" aria-label="Close">×</button></div>

      ${TD()?'':`<label class="chk"><input type="checkbox" id="l-paid" ${l.paid?'checked':''}> Paid</label>`}

      </div>

  <div class="sf">${isNew?'':`<button type="button" class="btn danger" data-act="del-lesson">Delete</button><button type="button" class="btn ghost" data-act="copy-reminder" data-id="${l.id}">Copy reminder</button>`}<span class="spacer"></span><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn primary" data-act="save-lesson">${isNew?'Add lesson':'Save'}</button></div>`,{lesson:l,isNew});

/* ---------- text for copying ---------- */
function sign(){const s=(S().signoff||'').trim();return s?'\n'+s:''}
function weekText(){
  let out=`Diary – week of ${shortDate(dateFor(0))}\n`;
  for(let d=0;d<7;d++){
    const list=dayLessons(d);const blocks=allBlocks().filter(b=>b.day===d);
    if(!list.length&&!blocks.length)continue;
    out+=`\n${DAYS_LONG[d]} ${shortDate(dateFor(d))}\n`;
    const items=[...list.map(l=>({t:l.start,s:`${fmt(l.start)}–${fmt(l.start+l.dur)}  ${pupil(l.pupilId)?.name||'?'} (${locLabel(pupil(l.pupilId),l.locKey)})`})),...blocks.map(b=>({t:b.start,s:b.start<=0&&b.end>=1440?`Day off${b.label?' – '+b.label:''}`:`${fmt(b.start)}–${fmt(b.end)}  ${b.label||'Blocked'}`}))].sort((a,b)=>a.t-b.t);
    out+=items.map(i=>i.s).join('\n')+'\n';
  }
  return out;
}
function dayText(d){const t=weekText().split('\n\n').find(x=>x.startsWith(DAYS_LONG[d]));return t||`${DAYS_LONG[d]}: nothing booked`}
function placeOf(p,l){return (l.locKey==='B'?p.locB:p.locA)?.label||'the usual place'}
function pupilText(p){
  const list=week.lessons.filter(l=>l.pupilId===p.id&&!gone(l)).sort((a,b)=>a.day-b.day||a.start-b.start);
  return `Hi ${first(p)}, your lesson${list.length>1?'s':''} for the week of ${shortDate(dateFor(0))}:\n`+list.map(l=>`${DAYS_LONG[l.day]} ${shortDate(dateFor(l.day))}, ${fmt(l.start)}–${fmt(l.start+l.dur)}, pick-up at ${placeOf(p,l)}`).join('\n')+sign();
}
function reminderText(l){
  const p=pupil(l.pupilId);if(!p)return'';const iso=isoOf(viewWeek,l.day);const n=daysUntil(iso);
  const when=n===0?'today':n===1?'tomorrow':'on '+niceDate(iso,true);
  return `Hi ${first(p)}, a reminder of your driving lesson ${when} at ${fmt(l.start)} (${hrs(l.dur)} h). I’ll pick you up at ${placeOf(p,l)}. See you then!`+sign();
}
function owedText(p){
  const xs=owedItems().filter(x=>x.p.id===p.id).sort((a,b)=>a.date.localeCompare(b.date));
  return `Hi ${first(p)}, a quick note that ${money(xs.reduce((s,x)=>s+x.fee,0))} is outstanding for your lesson${xs.length>1?'s':''} on ${xs.map(x=>niceDate(x.date)).join(', ')}. Thanks!`+sign();
}

    case 'day-on':{const d=+t.dataset.day;week.blocks=week.blocks.filter(b=>!(b.day===d&&b.start<=0&&b.end>=1440));save();closeSheet();renderAll();break}

function freeSlots(){
  const s=S(),out=[];
  for(let d=0;d<7;d++){
    const dh=s.days[d];if(!dh.on||(viewWeek===nowWeek()&&d<todayIdx()))continue;
    const busy=[...dayLessons(d).map(l=>[l.start-(+s.gap||0),l.start+l.dur+(+s.gap||0)]),...allBlocks().filter(b=>b.day===d).map(b=>[b.start,b.end])].sort((a,b)=>a[0]-b[0]);
    let t=dh.start;const fr=[];
    for(const [a,b] of busy){if(a-t>=60)fr.push([t,Math.min(a,dh.end)]);t=Math.max(t,b)}
    if(dh.end-t>=60)fr.push([t,dh.end]);
    if(fr.length)out.push(DAYS_LONG[d]+' '+fr.map(([a,b])=>f12(a)+'–'+f12(b)).join(', '));
  }
  return out;
}

/* ---------- drag to move / resize (15 min steps) ---------- */
let drag=null,suppressUntil=0;
const narrowMQ=window.matchMedia('(max-width:760px)');
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const el=e.target.closest('.lesson');if(!el)return;
  const l=week.lessons.find(x=>x.id===el.dataset.id);if(!l)return;
  const mode=e.target.closest('.rz')?'resize':'move';
  drag={el,l,mode,id:e.pointerId,x0:e.clientX,y0:e.clientY,active:false,touch:e.pointerType!=='mouse',timer:null,ns:l.start,nd:l.dur,nday:l.day};
  if(drag.touch&&mode==='move')drag.timer=setTimeout(()=>{if(drag&&!drag.active)beginDrag()},320);
});
function beginDrag(){
  drag.active=true;window.__dragging=true;drag.el.classList.add('dragging');document.body.classList.add('dragmode');
  try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}
}
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.active){
    if(Math.abs(dx)+Math.abs(dy)<6)return;
    if(drag.touch&&drag.mode==='move'){clearTimeout(drag.timer);drag=null;return} // finger is scrolling, not dragging
    beginDrag();
  }
  e.preventDefault();
  const [lo,hi]=weekRange();
  const steps=Math.round(dy/PPM/15)*15;
  const l=drag.l;
  if(drag.mode==='resize'){
    drag.nd=Math.max(15,Math.min(1440-l.start,l.dur+steps));
    drag.el.style.height=(drag.nd*PPM-2)+'px';
  }else{
    drag.ns=Math.max(lo,Math.min(hi-l.dur,l.start+steps));
    drag.el.style.top=((drag.ns-lo)*PPM)+'px';
    if(!narrowMQ.matches){
      const hit=document.elementFromPoint(e.clientX,e.clientY);const col=hit&&hit.closest('.col');
      if(col){
        drag.nday=+col.dataset.day;
        const oc=drag.el.parentElement.getBoundingClientRect(),nc=col.getBoundingClientRect();
        drag.el.style.transform=`translateX(${nc.left-oc.left}px)`;
      }
    }
  }
  const st=drag.mode==='resize'?l.start:drag.ns,du=drag.mode==='resize'?drag.nd:l.dur;
  const t=drag.el.querySelector('.t');if(t)t.textContent=`${DAYS[drag.nday]} ${fmt(st)}–${fmt(st+du)}`;
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  clearTimeout(drag.timer);
  const d=drag;drag=null;window.__dragging=false;document.body.classList.remove('dragmode');
  if(!d.active)return;
  suppressUntil=Date.now()+400;
  const l=d.l;
  const changed=e.type!=='pointercancel'&&(d.mode==='resize'?d.nd!==l.dur:(d.ns!==l.start||d.nday!==l.day));
  if(changed){
    pushUndo();
    if(d.mode==='resize')l.dur=d.nd;else{l.start=d.ns;l.day=d.nday;selDay=l.day}
    l.locked=true;save();
    toast(d.mode==='resize'?`Now ${hrs(l.dur)} h · ${fmt(l.start)}–${fmt(l.start+l.dur)}`:`Moved to ${DAYS[l.day]} ${fmt(l.start)} · locked`);
  }
  renderDiary();
}

/* ---------- Lessons: teaching sequence, progress and lesson cards ---------- */
const LP_ALL=STAGES.flatMap(s=>s.topics.map(t=>({...t,stage:s.n})));
LP_ALL.forEach((t,i)=>t.no=i+1);
const LP_SHAPE=[
 ["Recap","Ask what they remember from last time. Quick drive on the recap topic to check it stuck."],
 ["Agree the goal","Ask what they want to work on, then agree one clear goal and the level you're aiming for."],
 ["Brief","Short and parked up. Key points, a sketch if it helps, then questions both ways."],
 ["Practise","Start easy, then build. Move from talking them through to prompting to staying quiet as they improve."],
 ["Reflect","Pull over. They go first: what went well, what to work on, how it felt."],
 ["Set the next goal","Agree next lesson's goal before they get out, and record it."]
];
let lpView='overview',lpPupil='',lpOpen=new Set(['cockpit']);
const lpForm={date:'',len:'120',topic:'',now:'',target:'',recap:'',route:'',notes:''};
try{lpPupil=localStorage.getItem(KEY+':lp-pupil')||''}catch(e){}
function lpTopic(id){return LP_ALL.find(t=>t.id===id)}
function lpProg(pid){if(!pid)return null;state.progress=state.progress||{};return state.progress[pid]||(state.progress[pid]={t:{}})}
function lpLevel(pid,tid){const p=state.progress&&state.progress[pid];const v=p&&p.t?p.t[tid]:undefined;return v===undefined||v===null?-1:+v}
function lpNext(pid){return LP_ALL.find(t=>lpLevel(pid,t.id)<3)||null}
function lpChip(i){if(i<0)return '<span class="lp-lv"><i style="background:transparent;border:1px dashed var(--muted)"></i>Not started</span>';return `<span class="lp-lv"><i style="background:var(--lv${i})"></i>${LEVELS[i].k}</span>`}
function lpPupils(){return state.pupils.filter(p=>p.status!=='paused'&&p.status!=='passed').slice().sort((a,b)=>a.name.localeCompare(b.name,'en-GB',{sensitivity:'base'}))}
function lpStats(pid){let done=0,started=0;LP_ALL.forEach(t=>{const l=lpLevel(pid,t.id);if(l>=3)done++;if(l>=0)started++});return {done,started,total:LP_ALL.length}}

function renderLessons(){
  const el=document.getElementById('tab-lessons');
  if(lpPupil&&!pupil(lpPupil))lpPupil='';
  const pl=lpPupils();const p=pupil(lpPupil);
  let html=`<div class="lp-top">
    <label class="f lp-pick"><span>Pupil</span><select id="lp-pupil"><option value="">Choose a pupil</option>${pl.map(x=>`<option value="${x.id}" ${x.id===lpPupil?'selected':''}>${esc(x.name)}${x.status==='waiting'?' (waiting list)':''}</option>`).join('')}</select></label>
    <div class="seg" role="tablist">${[['overview','Everyone'],['sequence','Sequence'],['card','Lesson card'],['structure','Lesson structure']].map(([k,n])=>`<button type="button" data-lp="view" data-v="${k}" aria-pressed="${lpView===k}">${n}</button>`).join('')}</div>
  </div>`;
  if(p){
    const st=lpStats(p.id);const nx=lpNext(p.id);const pr=lpProg(p.id);
    html+=`<div class="lp-pupil" style="--pc:${p.color}"><span class="dot" style="margin:0"></span><div class="main"><b>${esc(p.name)}</b>
      <div class="muted small">${st.done} of ${st.total} topics Competent or better · ${nx?`Next up: <b>${nx.no}. ${esc(nx.name)}</b>`:'All topics Competent or better. Time for mock tests.'}</div>
      ${pr.goal?`<div class="small lp-goal">Next lesson goal: ${esc(pr.goal)}${pr.goalDate?` <span class="muted">(set ${esc(shortDate(new Date(pr.goalDate+'T12:00:00')))})</span>`:''}</div>`:''}
      <div class="lp-bar" aria-hidden="true">${LP_ALL.map(t=>{const l=lpLevel(p.id,t.id);return `<i title="${esc(t.name)}" style="background:${l<0?'var(--line)':'var(--lv'+l+')'}"></i>`}).join('')}</div>
    </div></div>`;
  }
  if(lpView==='overview')html+=lpOverview();
  if(lpView==='sequence')html+=lpSequence(p);
  if(lpView==='card')html+=lpCardShell(p);
  if(lpView==='structure')html+=lpStructure();
  el.innerHTML=html;
  if(lpView==='card')lpRenderCard();
}
function lpSequence(p){
  let h=`<p class="muted small lp-intro">Teach every pupil in this order. Each topic matches a skill in your Total Drive progress planner. Tap a topic for the fundamentals.${TD()?'':p?' Set '+esc(p.name.split(' ')[0])+'’s level inside each topic.':' Choose a pupil above to record their progress.'}</p>
  <div class="lp-key">${LEVELS.map((_,i)=>lpChip(i)).join('')}</div>
  <p class="muted small">Manoeuvres (stage 4) can be slotted in as short 20 to 30 minute blocks once a pupil is Guided on junctions.</p>`;
  for(const s of STAGES){
    h+=`<div class="lp-stage"><div class="lp-shead"><span class="lp-sno">Stage ${s.n}</span><h3>${esc(s.name)}</h3></div>`;
    for(const t0 of s.topics){

    if(a==='book')lessonSheet(null,{day:fdDay,start:fdStart,pupilId:b.dataset.id,locKey:b.dataset.loc});
  });
  sec.addEventListener('change',e=>{if(e.target.id==='fdTime'){const m=toMin(e.target.value);if(m!=null){fdStart=m;renderAvail()}}});
  sec.addEventListener('input',e=>{if(e.target.id==='avSearch'){avQ=e.target.value;const pos=e.target.selectionStart;renderAvail();const n=document.getElementById('avSearch');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}});
})();

setHdr();try{new ResizeObserver(setHdr).observe(hdrEl)}catch(e){}

selDay=todayIdx();
tab=tabFromHash()||'today';
if((tab==='today'||tab==='money')&&viewWeek!==nowWeek()){viewWeek=nowWeek();week=normWeek(cache[viewWeek])}
